<style>
:root{--creme:#F2ECE0;--tinte:#1C1412;--bordeaux:#7F1018;--grau:#5E534E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--creme);color:var(--tinte);font-family:'Archivo',sans-serif;font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;padding:48px 104px}
header{display:flex;justify-content:space-between;align-items:center}
.logo{height:20px;width:auto;display:block}
.etikett{font-family:'Archivo';font-size:11px;font-weight:450;text-transform:uppercase;letter-spacing:.3em;color:var(--grau)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1100px;padding:96px 0}
.regel{font-stretch:100%;font-weight:350;text-transform:uppercase;letter-spacing:.26em;color:var(--bordeaux);font-size:17px;margin-bottom:28px}
.gespuer{font-family:'Newsreader',serif;font-style:italic;font-weight:250;font-optical-sizing:auto;font-size:96px;line-height:1.02;letter-spacing:-.01em;max-width:900px}
.strich{width:64px;height:1px;background:var(--bordeaux);margin:56px 0 40px}
.count{display:flex;align-items:flex-start}
.unit{padding:0 48px 4px;border-left:1px solid rgba(127,16,24,.45)}
.unit:first-child{padding-left:0;border-left:0}
.num{display:block;font-stretch:75%;font-weight:300;font-variant-numeric:tabular-nums;font-size:88px;line-height:1;color:var(--tinte);margin-top:16px}
.ring{display:inline-block;border:1px solid var(--bordeaux);border-radius:999px;padding:12px 64px;transform:rotate(-3deg);margin-left:-65px;margin-top:2px}
.ring .num{transform:rotate(3deg);margin-top:0}
.golive{margin-top:48px;display:flex;gap:28px;align-items:baseline;flex-wrap:wrap}
.golive .notiz{font-family:'Newsreader',serif;font-style:italic;font-weight:300;font-size:20px;color:var(--grau)}
footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(127,16,24,.45);padding-top:24px}
.swiss{height:11px;width:auto;display:block}
.live .count{display:none}
main>*{opacity:0;animation:in .8s ease-out forwards}
main>*:nth-child(2){animation-delay:.1s}main>*:nth-child(3){animation-delay:.2s}main>*:nth-child(4){animation-delay:.3s}main>*:nth-child(5){animation-delay:.4s}
@keyframes in{to{opacity:1}}
@media (max-width:900px){
 body{padding:24px}
 main{padding:72px 0}
 .gespuer{font-size:52px}
 .regel{font-size:13px;margin-bottom:20px}
 .strich{margin:40px 0 32px}
 .unit{padding:0 14px}
 .unit .etikett{font-size:9px;letter-spacing:.18em}
 .num{font-size:40px}
 .ring{padding:7px 26px;margin-left:-22px}
 header .etikett{display:none}
 footer{flex-direction:column;align-items:flex-start;gap:16px}
}
@media (prefers-reduced-motion:reduce){main>*{animation:none;opacity:1}}

<script>
(function(){
 var target=Date.UTC(2026,10,30,23,0,0); // 1.12.2026 00:00 Europe/Zurich
 var el={d:document.getElementById('d'),h:document.getElementById('h'),m:document.getElementById('m'),s:document.getElementById('s')};
 function p(n){return n<10?'0'+n:''+n}
 function tick(){
  var diff=target-Date.now();
  if(diff<=0){
   document.body.classList.add('live');
   document.getElementById('label').textContent='Live seit 1. Dezember 2026';
   document.getElementById('notiz').textContent='Wir sind da.';
   return;
  }
  var t=Math.floor(diff/1000);
  el.d.textContent=p(Math.floor(t/86400));
  el.h.textContent=p(Math.floor(t%86400/3600));
  el.m.textContent=p(Math.floor(t%3600/60));
  el.s.textContent=p(t%60);
  setTimeout(tick,1000-(Date.now()%1000));
 }
 tick();
})();
</script>
