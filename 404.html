<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STRYVE Coach</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="STRYVE Coach">
<meta property="og:description" content="Dein Plan für deine Ziele. Wir bauen den Coach, der dich kennt.">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F2ECE0;color:#1C1412;font-family:system-ui,sans-serif}a{color:#7F1018}</style>
</head>
<body>
<p><a href="/">STRYVE</a></p>
<script>
// STRYVE Kurzlinks auf stryve.coach (stiller Start). Englische Pfade, nie übersetzt; Kurzpfad = Quelle.
// Ziel-Host nur hier: nach dem Domainwechsel auf https://app.stryve.coach umstellen.
(function(){
 var APP='https://stryve-web-a4splzk4nq-oa.a.run.app';
 // Kurzlinks mit eigener Logik (Sprache, Quelle)
 var MAP={
  'start':   {to:'/start', lang:true},
  'founding':{to:'/start', lang:true, src:'founding'},
  'ai':      {to:'/agb'} // vorläufig: AI-Kennzeichnung in AGB Ziff. 2, bis eine eigene Seite steht
 };
 // Pfade der Plattform: Pfad und Query gehen unverändert weiter (Tokens sind gross-/kleinschreibungssensitiv)
 var PASS=['privacy','terms','imprint','login','pay','account','connect','week','app','datenschutz','agb','impressum','abo','plan','garmin','p','dashboard','availability'];
 function lang(){
  var l=((navigator.languages&&navigator.languages[0])||navigator.language||'').slice(0,2).toLowerCase();
  return ['de','fr','pt','en'].indexOf(l)>-1?l:'en';
 }
 function clean(s){return String(s||'').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,32);}
 var path=location.pathname.replace(/\/+$/,'');
 var parts=path.replace(/^\/+/,'').split('/');
 var head=parts[0].toLowerCase();
 if(PASS.indexOf(head)>-1){location.replace(APP+path+location.search);return;}
 var r=MAP[head];
 if(!r||parts.length>2||(parts.length===2&&head!=='founding')){location.replace('/');return;}
 var q=new URLSearchParams(location.search);
 if(r.lang&&!q.get('lang'))q.set('lang',lang());
 if(r.src&&!q.get('src')){var c=clean(decodeURIComponent(parts[1]||''));q.set('src',c?r.src+'-'+c:r.src);}
 var s=q.toString();
 location.replace(APP+r.to+(s?'?'+s:''));
})();
</script>
</body>
</html>
